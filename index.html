<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06110b">
<title>FC Germania 09 – Sponsoren</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 34%,rgba(48,126,75,.20),transparent 43%),linear-gradient(145deg,#06110b,#0a2115 52%,#050d09);color:#fff}.stage{position:relative;width:100vw;height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(16px,2.8vw,44px)}.stage:before{content:"FCG 09";position:absolute;right:-2vw;bottom:-6vh;font-size:min(28vw,420px);font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.025);white-space:nowrap}.card{position:relative;width:min(94vw,1500px);height:min(91vh,920px);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;align-items:center;justify-items:center;gap:clamp(8px,1.4vh,18px);padding:clamp(22px,3vw,48px) clamp(24px,4vw,64px) clamp(34px,4vh,54px);border:1px solid rgba(255,255,255,.11);border-radius:clamp(20px,2.5vw,38px);background:rgba(7,20,13,.76);box-shadow:0 24px 80px rgba(0,0,0,.34);opacity:0;transform:scale(.99);transition:opacity .45s ease,transform .45s ease}.card.visible{opacity:1;transform:scale(1)}.eyebrow{font-size:clamp(12px,1.25vw,19px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.68);text-align:center}.logo-wrap{width:min(82vw,1180px);height:min(49vh,500px);display:flex;align-items:center;justify-content:center;border-radius:clamp(18px,2vw,28px);background:rgba(255,255,255,.97);padding:clamp(18px,3vw,48px);overflow:hidden}.logo-wrap.no-logo{background:rgba(255,255,255,.07)}#logo{width:100%;height:100%;object-fit:contain;display:block}.fallback{display:none;max-width:90%;text-align:center;font-size:clamp(32px,5vw,76px);font-weight:900;line-height:1.05}.sponsor{max-width:94%;font-size:clamp(25px,3.5vw,54px);line-height:1.08;font-weight:900;text-align:center;text-wrap:balance}.claim{max-width:min(92%,1150px);height:2.65em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:clamp(18px,2vw,31px);line-height:1.3;font-weight:500;text-align:center;color:rgba(255,255,255,.88);text-wrap:balance}.progress-track{position:absolute;left:clamp(24px,4vw,64px);right:clamp(24px,4vw,64px);bottom:clamp(14px,1.8vh,24px);height:4px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden}.progress{height:100%;width:0;background:rgba(255,255,255,.72);border-radius:99px}.progress.run{animation:countdown linear forwards}.footer{position:absolute;left:clamp(18px,2vw,34px);right:clamp(18px,2vw,34px);bottom:clamp(6px,.7vh,11px);display:flex;justify-content:space-between;font-size:clamp(9px,.8vw,13px);color:rgba(255,255,255,.32);pointer-events:none}.error{padding:28px;text-align:center;font-size:clamp(18px,2vw,28px)}@keyframes countdown{from{width:0}to{width:100%}}@media(orientation:portrait){.card{height:93vh;padding:24px 5vw 48px}.logo-wrap{width:82vw;height:min(42vh,470px)}.sponsor{font-size:clamp(28px,6vw,58px)}.claim{font-size:clamp(18px,3.5vw,31px)}}
</style></head>
<body><main class="stage"><section class="card" id="card" aria-live="polite"><div class="eyebrow" id="category"></div><div class="logo-wrap" id="logoWrap"><img id="logo" alt="Sponsorlogo"><div class="fallback" id="fallback"></div></div><div class="sponsor" id="sponsor"></div><div class="claim" id="claim"></div><div class="progress-track"><div class="progress" id="progress"></div></div></section><div class="footer"><span>FC Germania 09 Großkrotzenburg</span><span id="status"></span></div></main>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTYX-jozloAfaj-tZ11ZOAIglmyjME58WRa2H52XHjBm0ZpHx78JEsL08091BMRxrSgTHm_BDleAzk0/pub?gid=2113186516&single=true&output=csv',REFRESH_MS=60000,DEFAULT_SECONDS=8,VISIBLE_START_DELAY_MS=500;
const params=new URLSearchParams(location.search),START_INDEX=Math.max(0,parseInt(params.get('start')||'0',10)||0),BLOCK_COUNT=Math.max(0,parseInt(params.get('count')||'0',10)||0);
let sponsors=[],currentIndex=-1,slideTimer=null,transitionTimer=null,visibleStartTimer=null,signature='',shownInBlock=0,initialized=false,blockRunning=false,blockStarted=false,blockCompleted=false;
const card=document.getElementById('card'),logoWrap=document.getElementById('logoWrap'),logo=document.getElementById('logo'),fallback=document.getElementById('fallback'),sponsorEl=document.getElementById('sponsor'),claimEl=document.getElementById('claim'),categoryEl=document.getElementById('category'),statusEl=document.getElementById('status'),progress=document.getElementById('progress');
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else{if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}}if(field.length||row.length){row.push(field);rows.push(row)}if(!rows.length)return[];const headers=rows.shift().map(h=>h.trim().replace(/^\uFEFF/,''));return rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>{const o={};headers.forEach((h,i)=>o[h]=(r[i]??'').trim());return o})}
function boolTrue(v){return['true','wahr','1','yes','ja','x'].includes(String(v||'').trim().toLowerCase())}
function parseDate(v){v=String(v||'').trim();if(!v)return null;let m;if(m=v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/))return new Date(+m[3],+m[2]-1,+m[1]);if(m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(v);return isNaN(d)?null:d}
function valid(s){if(!boolTrue(s.Aktiv))return false;const n=new Date(),f=parseDate(s.GueltigVon||s.GültigVon),u=parseDate(s.GueltigBis||s.GültigBis);if(f&&n<f)return false;if(u){u.setHours(23,59,59,999);if(n>u)return false}return true}
function normalize(rows){return rows.filter(valid).map((s,p)=>({id:s.SponsorID||`row-${p}`,name:s.Sponsor||'',logo:s.Logo||s.LogoURL||'',claim:s.AnzeigeLeitsatz||s.Leitsatz1||'',category:s.Kategorie||'Sponsor',seconds:Math.max(3,Number(String(s.AnzeigedauerSek||DEFAULT_SECONDS).replace(',','.'))||DEFAULT_SECONDS),order:Number(String(s.Reihenfolge||p+1).replace(',','.'))||p+1})).filter(s=>s.name).sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'de'))}
async function loadSponsors(){try{const r=await fetch(`${CSV_URL}&_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const next=normalize(parseCSV(await r.text()));if(!next.length)throw Error('Keine aktiven Sponsoren gefunden');const sig=JSON.stringify(next);sponsors=next;statusEl.textContent=`${sponsors.length} aktive Partner`;if(!initialized){initialized=true;signature=sig;currentIndex=(START_INDEX%sponsors.length)-1;shownInBlock=0;scheduleVisibleStart()}else if(signature!==sig){signature=sig}}catch(e){console.error(e);if(!sponsors.length){card.classList.add('visible');card.innerHTML=`<div class="error">Sponsor-Daten konnten gerade nicht geladen werden.<br><small>${String(e.message||e)}</small></div>`;statusEl.textContent='Verbindungsfehler'}}}
function startProgress(sec){progress.classList.remove('run');progress.style.animationDuration=`${sec}s`;void progress.offsetWidth;progress.classList.add('run')}
function stopProgress(){progress.classList.remove('run')}
function render(s){categoryEl.textContent=`${s.category} | FC GERMANIA 09`;sponsorEl.textContent=s.name;claimEl.textContent=s.claim;fallback.textContent=s.name;logo.onload=()=>{logo.style.display='block';fallback.style.display='none';logoWrap.classList.remove('no-logo')};logo.onerror=()=>{logo.style.display='none';fallback.style.display='block';logoWrap.classList.add('no-logo')};if(s.logo){logo.style.display='block';fallback.style.display='none';logoWrap.classList.remove('no-logo');logo.src=s.logo}else{logo.removeAttribute('src');logo.style.display='none';fallback.style.display='block';logoWrap.classList.add('no-logo')}}
function stopBlock(){blockRunning=false;clearTimeout(slideTimer);clearTimeout(transitionTimer);clearTimeout(visibleStartTimer);stopProgress()}
function startBlock(){if(!initialized||!sponsors.length||document.hidden||blockStarted||blockCompleted)return;blockStarted=true;blockRunning=true;currentIndex=(START_INDEX%sponsors.length)-1;shownInBlock=0;showNext()}
function scheduleVisibleStart(){clearTimeout(visibleStartTimer);if(!initialized||document.hidden||blockStarted||blockCompleted)return;visibleStartTimer=setTimeout(()=>{if(!document.hidden&&!blockStarted&&!blockCompleted)startBlock()},VISIBLE_START_DELAY_MS)}
function showNext(){clearTimeout(slideTimer);clearTimeout(transitionTimer);if(!blockRunning||document.hidden||!sponsors.length)return;if(BLOCK_COUNT&&shownInBlock>=BLOCK_COUNT){blockRunning=false;blockCompleted=true;return}card.classList.remove('visible');transitionTimer=setTimeout(()=>{if(!blockRunning||document.hidden)return;currentIndex=(currentIndex+1)%sponsors.length;const s=sponsors[currentIndex];shownInBlock++;render(s);requestAnimationFrame(()=>card.classList.add('visible'));startProgress(s.seconds);if(!BLOCK_COUNT||shownInBlock<BLOCK_COUNT)slideTimer=setTimeout(showNext,s.seconds*1000);else slideTimer=setTimeout(()=>{blockRunning=false;blockCompleted=true;stopProgress()},s.seconds*1000)},shownInBlock===0?0:350)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(visibleStartTimer);if(!blockStarted)stopProgress();else if(!blockCompleted)stopBlock()}else scheduleVisibleStart()});
loadSponsors();setInterval(()=>loadSponsors(),REFRESH_MS);
</script></body></html>
